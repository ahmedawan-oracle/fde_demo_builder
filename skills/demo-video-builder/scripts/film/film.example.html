<!doctype html>
<html><head><meta charset="utf-8"><title>v4 film template — recreated cards around real footage</title>
<!--
  film.example.html — the v4 film template. One pure frame(t) on the narration clock:
    0 … FILM.openEnd     recreated title card (word-keyed) on a seeded-grain, vignetted ground
    FILM.openEnd …       real footage (lib/footage.js): each beat opens on the ORIGINAL full screen, then zooms
    FILM.close … END     recreated closing card
  Layers on top, in screen space (never inside #camera): lower thirds (lib/overlays.js), the caption lane
  (lib/captions.js, groups computed from the narration's word times), the head fade.
  Cuts are SEAMS: seams.json declares each one; lib/seams.js moves the outgoing and incoming layers so the
  eye's momentum survives the cut; gates/seam_gate.py measures it on the rendered film.
  Rendered deterministically by render_frames.js (?render, __seek/__step). The mandatory FDE Demo Builder credit
  is NOT drawn here — build_film.py stamps it on the final video (credit.py), so no scene can drop it.
  Everything shown in this example is fictional (Acme, synthetic data). Colours are skin tokens (:root vars).
-->
<style>
@font-face{font-family:'Georgia';src:local('Georgia')}
@font-face{font-family:'Arial';src:local('Arial')}
@font-face{font-family:'Segoe UI';src:local('Segoe UI')}
:root{--paper:#082A34;--paper2:#204A56;--ink:#E9F3F9;--ink-soft:#ECDEC3;--muted:#81A9AB;--accent:#E56B5E;--gold:#E8C874;--black:#05161C;
      --title-font:Georgia,serif;--body-font:Arial,'Segoe UI',sans-serif;--title-size:64px}
html,body{margin:0;background:var(--paper);overflow:hidden;width:1280px;height:720px;font-family:var(--body-font);-webkit-font-smoothing:antialiased}
body.pre #stage{visibility:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--paper),var(--paper2))}
#camera{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#clipWrap{position:absolute;inset:0;overflow:hidden;background:#fff;opacity:0}
#clipImg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#pageView{position:absolute;overflow:hidden;display:none}
#pageDoc{position:absolute;left:0;top:0;will-change:transform}
#pageImg{position:absolute;left:0;top:0;display:block}
.hl{position:absolute;pointer-events:none;opacity:0}
.hl.box{border:2px solid var(--accent);background:rgba(229,107,94,.08);border-radius:4px}
.hl.row{background:rgba(229,107,94,.12);border-left:3px solid var(--accent)}
.hl.tag{background:var(--paper);color:var(--ink);font:600 13px/1 var(--body-font);padding:7px 10px;border-radius:4px;border-left:3px solid var(--accent);white-space:nowrap}
.rv-plate{position:absolute}.rv-caret{position:absolute;width:2px}
.curtain{position:absolute;left:0;width:100%}
/* cards are opaque plates: a seam moves the whole surface, which the eye (and the seam gate) can follow */
.card{position:absolute;inset:0;z-index:6;color:var(--ink);opacity:0;background:linear-gradient(180deg,var(--paper),var(--paper2))}
#grainL{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none;z-index:7}
#vig{position:absolute;inset:0;pointer-events:none;z-index:8}
.card .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:50% 50%}
.card h1{font:400 var(--title-size)/1.1 var(--title-font);margin:0;letter-spacing:-.01em}
.card h2{font:400 22px/1.4 var(--body-font);margin:18px 0 0;color:var(--ink-soft)}
.card .cap{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font:500 14px/1 var(--body-font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}   /* outside the pushed .inner: stays inside title-safe */
.card .rule{width:90px;height:3px;background:var(--accent);margin:26px 0 0}
.close p{font:400 44px/1.25 var(--title-font);margin:0}
.close p:first-child{color:var(--gold)}
#ovl,#cap{position:absolute;inset:0;z-index:40;pointer-events:none}
#black{position:absolute;inset:0;background:var(--black);opacity:0;z-index:70}
</style></head>
<body>
<div id="stage">
  <div id="camera">
    <div id="clipWrap">
      <img id="clipImg" alt="">
      <div id="revealHost"></div><div id="stillHl"></div><div id="stillCurtain" class="curtain" style="display:none"></div>
      <div id="pageView"><div id="pageDoc"><img id="pageImg" alt=""><div id="pageHl"></div>
        <div id="pageCurtain" class="curtain" style="display:none"></div></div></div>
    </div>
  </div>
  <canvas id="grainL" width="1280" height="720"></canvas>
  <div id="vig"></div>
  <div class="card" id="titleCard"><div class="inner" id="titleInner"><h1 id="tTitle"></h1><div class="rule" id="tRule"></div><h2 id="tSub"></h2></div><div class="cap" id="tCap"></div></div>
  <div class="card close" id="closeCard"><div class="inner" id="closeInner"></div></div>
  <div id="ovl"></div>
  <div id="cap" data-qa-allow-overflow data-qa-allow-overlap></div>   <!-- the lane's active-word lift is deliberate; gates/overlay_gate.py owns caption geometry -->
  <div id="black"></div>
</div>
<script src="lib/grammar.js"></script>
<script src="timing_film.js"></script>
<script src="lib/timeline.js"></script>
<script src="lib/footage.js"></script>
<script src="lib/camera.js"></script>
<script src="lib/seams.js"></script>
<script src="lib/captions.js"></script>
<script src="lib/overlays.js"></script>
<script src="lib/vfx.js"></script>
<script src="../broll/clips.js"></script>
<script src="shots.js"></script>
<script src="seams_data.js"></script>
<script src="captions_data.js"></script>
<script>
'use strict';
const RENDER = /[?&]render/.test(location.search), NOCAP = /[?&]nocap/.test(location.search);
if (RENDER) document.body.classList.add('pre');
const T = window.TX, P = T.P, wt = T.wt, F = window.FILM, SH = window.SHOTS, END = T.total;
const { clamp, rmp, EIO } = window.G;
const $ = s => document.querySelector(s);
const op = (e, v) => { e.style.opacity = clamp(v, 0, 1).toFixed(3); };
const cam = $('#camera');
const lane = FOOT.create({ T: T, CL: window.CLIPS, HL: window.HL, base: '../broll/', els: {
  wrap: $('#clipWrap'), img: $('#clipImg'), reveal: $('#revealHost'), stillHl: $('#stillHl'), stillCurtain: $('#stillCurtain'),
  pageView: $('#pageView'), pageDoc: $('#pageDoc'), pageImg: $('#pageImg'), pageHl: $('#pageHl'), pageCurtain: $('#pageCurtain') } });

$('#tTitle').textContent = F.title; $('#tSub').textContent = F.subtitle; $('#tCap').textContent = F.caption;
$('#closeInner').innerHTML = F.closeLines.map(l => '<p>' + l + '</p>').join('');

/* seams: the ledger (scenes/seams_data.js, written by export_timeline.js from seams.json) owns every cut it declares */
const HAS_SEAMS = !!(window.SEAM && window.SEAMS_LEDGER);
if (HAS_SEAMS) { SEAM.build(window.SEAMS_LEDGER, T, F); const SV = SEAM.validate(SEAM.ledger().rows); if (!SV.ok) throw new Error('seams.json: ' + SV.errors.join('; ')); }
/* captions: groups are pure arithmetic on the narration's word times (identical in node → the SRT twin) */
const caps = window.CAP ? CAP.build(T, Object.assign({ end: END + 1.2 }, window.CAPTIONS || {})) : null;
/* finishing on the recreated cards only: vignette once, seeded grain per frame (never on the footage lane) */
const grainCtx = $('#grainL').getContext('2d');
if (window.VFX) VFX.vignette($('#vig'), { amount: 0.12, mid: 0.5, feather: 0.65 });

/* one wrapper carries both sides of a footage-to-footage seam: "#camera" is the exit row, "#camera-in" the entry row */
function seamOff(t) { if (!HAS_SEAMS) return null; const a = SEAM.offset(t, '#camera'), b = SEAM.offset(t, '#camera-in'); return (b && b.visible) ? b : (a && a.visible) ? a : (b || a); }
function applyCam(s, cx, cy) {
  const hw = 640 / s, hh = 360 / s, x = clamp(cx, hw, 1280 - hw), y = clamp(cy, hh, 720 - hh);
  const off = seamOff(t_now);
  let S = s, tx = 640 - s * x, ty = 360 - s * y;
  if (off) { S = s * off.s; tx = 640 - S * x + off.x; ty = 360 - S * y + off.y; cam.style.opacity = off.visible ? off.op.toFixed(3) : '0'; cam.style.filter = off.blur > 0.05 ? 'blur(' + off.blur.toFixed(1) + 'px)' : 'none'; }
  else { cam.style.opacity = '1'; cam.style.filter = 'none'; }
  cam.style.transform = (S < 1.0005 && !off) ? 'none' : 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + S.toFixed(4) + ')';
}
function rise(e, t, a, d) { const u = EIO(rmp(t, a, a + (d || 0.5))); e.style.opacity = u.toFixed(3); e.style.transform = 'translateY(' + ((1 - u) * 12).toFixed(1) + 'px)'; }

let t_now = 0;
function frame(t) {
  t_now = t;
  let pend = [], c = { s: 1, cx: 640, cy: 360 };
  /* title card: each line lands on a spoken word; a slow push (1.2 %/s) is the only idle motion; the seam owns its exit */
  const tc = $('#titleCard'), onTitle = t < F.openEnd;
  op(tc, HAS_SEAMS ? (onTitle ? 1 : 0) : (onTitle ? 1 : 1 - rmp(t, F.openEnd, F.openEnd + 0.25)));
  $('#titleInner').style.transform = 'scale(' + (1 + 0.012 * Math.min(t, F.openEnd)).toFixed(4) + ')';
  rise($('#tTitle'), t, wt('hook', 'Monday') - 0.1); rise($('#tSub'), t, wt('title', 'workflow') - 0.2);
  op($('#tRule'), rmp(t, wt('hook', 'question') - 0.1, wt('hook', 'question') + 0.4)); op($('#tCap'), rmp(t, wt('title', 'fictional'), wt('title', 'fictional') + 0.4));
  /* footage: the lane draws the pixels, CAM frames them (named eases, punches, caret follow), the seam offsets the camera */
  const sh = t >= F.openEnd && t < F.close ? lane.shotAt(SH, t) : null;
  if (sh) { c = lane.draw(sh, t); pend = c.pending; if (window.CAM) { const pose = CAM.resolve(sh, t); c = { s: pose.s, cx: pose.cx, cy: pose.cy, pending: pend }; } }
  else lane.hide();
  applyCam(c.s, c.cx, c.cy);
  /* closing card: lines land on the three "One"s; the seam brings the card in */
  const cc = $('#closeCard'), onClose = t >= F.close;
  op(cc, HAS_SEAMS ? (onClose ? 1 : 0) : rmp(t, F.close - 0.25, F.close + 0.2));
  $('#closeInner').style.transform = 'scale(' + (1 + 0.012 * Math.max(0, t - F.close)).toFixed(4) + ')';
  // the first line is already up when the seam carries the card in (a seam needs a visible carrier); the others land on their words
  Array.from($('#closeInner').children).forEach((p, i) => rise(p, t, i === 0 ? F.close - 0.6 : wt('close', 'One', i + 1) - 0.1));
  /* finishing: grain + vignette only while a recreated card is up; the grain fades out around every seam so the
     seam gate (and the eye) reads the card's own motion, not per-frame noise */
  const onCard = onTitle || onClose;
  const nearSeam = HAS_SEAMS ? Math.max(0, ...SEAM.windows().map(w => 1 - clamp(Math.min(Math.abs(t - w.t0), Math.abs(t - w.t1), t >= w.t0 && t <= w.t1 ? 0 : 1) / 0.5, 0, 1))) : 0;
  $('#grainL').style.opacity = onCard ? (1 - nearSeam).toFixed(3) : '0'; $('#vig').style.opacity = onCard ? '1' : '0';
  if (onCard && nearSeam < 1 && window.VFX) VFX.grain(grainCtx, t, { amount: 0.12, size: 0.18, roughness: 0.65, fps: 30 });
  /* lower thirds + caption lane in screen space (the lane lifts above a visible lower third, hides under the credit) */
  const lts = window.OVL ? F.acts.map((a, i) => OVL.lowerThird($('#ovl'), t, { id: 'lt' + i, t0: a.t0 + 0.3, dur: 4.8, label: a.label, text: a.text, variant: a.variant || 'auto', phase: a.phase })) : [];
  if (caps && !NOCAP) caps.draw($('#cap'), t, { avoid: lts.filter(l => l && l.visible).map(l => l.rect) });
  /* the ledger writes the card layers it owns (title out, close in) */
  if (HAS_SEAMS) SEAM.apply(t, ['#camera']);
  /* head fade-in only: the film ends on the closing card, where build_film.py stamps the mandatory credit */
  op($('#black'), 1 - rmp(t, 0, 0.3));
  return pend.length ? Promise.all(pend) : undefined;
}
let t0 = null;
function loop(now) { if (t0 === null) t0 = now; const t = (now - t0) / 1000; frame(t); if (!RENDER && t > END + 1) t0 = now; requestAnimationFrame(loop); }
window.__seek = t => { document.body.classList.remove('pre'); lane.reset(); const a = frame(t); return Promise.resolve(a).then(() => frame(t)); };
window.__step = t => frame(t);
window.__total = END;
if (!RENDER) { const q = new URLSearchParams(location.search); if (q.has('t')) window.__seek(parseFloat(q.get('t'))); else requestAnimationFrame(loop); }
</script></body></html>
