<!doctype html>
<html><head><meta charset="utf-8"><title>v3 film template — recreated cards around real footage</title>
<!--
  film.example.html — the v3 film template. One pure frame(t) on the narration clock:
    0 … FILM.openEnd     recreated title card (word-keyed), honesty caption
    FILM.openEnd …       real footage (lib/footage.js): each beat opens on the ORIGINAL full screen, then zooms
    FILM.close … END     recreated closing card
  Rendered deterministically by render_frames.js (?render, __seek/__step). The mandatory FDE Demo Builder
  credit is NOT drawn here — build_film.py stamps it on the final video (credit.py), so no scene can drop it.
  Everything shown in this example is fictional (Acme, synthetic data).
-->
<style>
html,body{margin:0;background:#082A34;overflow:hidden;width:1280px;height:720px;font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.pre #stage{visibility:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#082A34,#204A56)}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(129,169,171,.22),rgba(129,169,171,0) 65%)}
#camera{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#clipWrap{position:absolute;inset:0;overflow:hidden;background:#fff;opacity:0}
#clipImg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#pageView{position:absolute;overflow:hidden;display:none}
#pageDoc{position:absolute;left:0;top:0;will-change:transform}
#pageImg{position:absolute;left:0;top:0;display:block}
.hl{position:absolute;pointer-events:none;opacity:0}
.hl.box{border:2px solid #E56B5E;background:rgba(229,107,94,.08);border-radius:4px}
.hl.row{background:rgba(229,107,94,.12);border-left:3px solid #E56B5E}
.hl.tag{background:#082A34;color:#E9F3F9;font:600 13px/1 Arial;padding:7px 10px;border-radius:4px;border-left:3px solid #E56B5E;white-space:nowrap}
.rv-plate{position:absolute}.rv-caret{position:absolute;width:2px}
.curtain{position:absolute;left:0;width:100%}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E9F3F9;opacity:0}
.card h1{font:400 64px/1.1 Georgia,serif;margin:0;letter-spacing:-.01em}
.card h2{font:400 22px/1.4 "Helvetica Neue",Arial;margin:18px 0 0;color:#ECDEC3}
.card .cap{position:absolute;bottom:34px;font:500 13px/1 Arial;letter-spacing:.12em;text-transform:uppercase;color:#81A9AB}
.card .rule{width:90px;height:3px;background:#E56B5E;margin:26px 0 0}
.close p{font:400 44px/1.25 Georgia,serif;margin:0}
.close p:first-child{color:#E8C874}
#lower{position:absolute;left:36px;bottom:40px;z-index:30;opacity:0;background:#082A34;color:#E9F3F9;border-left:3px solid #E56B5E;padding:10px 16px;border-radius:4px}
#lower .lab{font:700 11px/1 Arial;letter-spacing:.16em;color:#81A9AB}
#lower .txt{font:500 17px/1.3 Arial;margin-top:6px}
#black{position:absolute;inset:0;background:#05161C;opacity:0;z-index:70}
</style></head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="camera">
    <div id="clipWrap">
      <img id="clipImg" alt="">
      <div id="revealHost"></div><div id="stillHl"></div><div id="stillCurtain" class="curtain" style="display:none"></div>
      <div id="pageView"><div id="pageDoc"><img id="pageImg" alt=""><div id="pageHl"></div>
        <div id="pageCurtain" class="curtain" style="display:none"></div></div></div>
    </div>
  </div>
  <div class="card" id="titleCard"><h1 id="tTitle"></h1><div class="rule" id="tRule"></div><h2 id="tSub"></h2><div class="cap" id="tCap"></div></div>
  <div class="card close" id="closeCard"></div>
  <div id="lower"><div class="lab"></div><div class="txt"></div></div>
  <div id="black"></div>
</div>
<script src="lib/grammar.js"></script>
<script src="timing_film.js"></script>
<script src="lib/timeline.js"></script>
<script src="lib/footage.js"></script>
<script src="../broll/clips.js"></script>
<script src="shots.js"></script>
<script>
'use strict';
const RENDER = /[?&]render/.test(location.search);
if (RENDER) document.body.classList.add('pre');
const T = window.TX, P = T.P, wt = T.wt, F = window.FILM, SH = window.SHOTS, END = T.total;
const { clamp, rmp, EZ, EIO, fadeInOut } = window.G;
const $ = s => document.querySelector(s);
const op = (e, v) => { e.style.opacity = clamp(v, 0, 1).toFixed(3); };
const cam = $('#camera');
const lane = FOOT.create({ T: T, CL: window.CLIPS, HL: window.HL, base: '../broll/', els: {
  wrap: $('#clipWrap'), img: $('#clipImg'), reveal: $('#revealHost'), stillHl: $('#stillHl'), stillCurtain: $('#stillCurtain'),
  pageView: $('#pageView'), pageDoc: $('#pageDoc'), pageImg: $('#pageImg'), pageHl: $('#pageHl'), pageCurtain: $('#pageCurtain') } });

$('#tTitle').textContent = F.title; $('#tSub').textContent = F.subtitle; $('#tCap').textContent = F.caption;
$('#closeCard').innerHTML = F.closeLines.map(l => '<p>' + l + '</p>').join('');

function applyCam(s, cx, cy) {
  if (s < 1.0005) { cam.style.transform = 'none'; return; }
  const hw = 640 / s, hh = 360 / s, x = clamp(cx, hw, 1280 - hw), y = clamp(cy, hh, 720 - hh);
  cam.style.transform = 'translate(' + (640 - s * x).toFixed(2) + 'px,' + (360 - s * y).toFixed(2) + 'px) scale(' + s.toFixed(4) + ')';
}
function rise(e, t, a, d) { const u = EIO(rmp(t, a, a + (d || 0.5))); e.style.opacity = u.toFixed(3); e.style.transform = 'translateY(' + ((1 - u) * 12).toFixed(1) + 'px)'; }

function frame(t) {
  let pend = [], c = { s: 1, cx: 640, cy: 360 };
  // title card: each line lands on a spoken word
  const tc = $('#titleCard');
  op(tc, t < F.openEnd ? 1 - rmp(t, F.openEnd - 0.35, F.openEnd) : 0);
  // recreated cards never sit still (QA: no freeze > 5 s): a slow push + a drifting glow
  tc.style.transform = 'scale(' + (1 + 0.012 * Math.min(t, F.openEnd)).toFixed(4) + ')';
  $('#closeCard').style.transform = 'scale(' + (1 + 0.012 * Math.max(0, t - F.close)).toFixed(4) + ')';
  const g = $('#glow').style; g.left = (-200 + 38 * t % 1400).toFixed(1) + 'px'; g.top = (-260 + 60 * Math.sin(t * 0.35)).toFixed(1) + 'px';
  rise($('#tTitle'), t, wt('hook', 'Monday') - 0.1); rise($('#tSub'), t, wt('title', 'workflow') - 0.2);
  op($('#tRule'), rmp(t, wt('hook', 'question') - 0.1, wt('hook', 'question') + 0.4)); op($('#tCap'), rmp(t, wt('title', 'fictional'), wt('title', 'fictional') + 0.4));
  // footage
  const sh = t >= F.openEnd && t < F.close ? lane.shotAt(SH, t) : null;
  if (sh) { c = lane.draw(sh, t); pend = c.pending; } else lane.hide();
  applyCam(c.s, c.cx, c.cy);
  // closing card
  const cc = $('#closeCard'); op(cc, rmp(t, F.close - 0.25, F.close + 0.2));
  Array.from(cc.children).forEach((p, i) => rise(p, t, wt('close', ['One', 'One', 'One'][i], i + 1) - 0.1));
  // lower thirds
  const L = F.acts.filter(a => t >= a.t0 + 0.3 && t < a.t0 + 3.8).pop(), lo = $('#lower');
  if (L) { lo.children[0].textContent = L.label; lo.children[1].textContent = L.text; op(lo, fadeInOut(t, L.t0 + 0.3, L.t0 + 3.8, 0.3, 0.35)); } else op(lo, 0);
  // head fade-in only: the film ends on the closing card, where build_film.py stamps the mandatory credit
  op($('#black'), 1 - rmp(t, 0, 0.3));
  return pend.length ? Promise.all(pend) : undefined;
}
let t0 = null;
function loop(now) { if (t0 === null) t0 = now; const t = (now - t0) / 1000; frame(t); if (!RENDER && t > END + 1) t0 = now; requestAnimationFrame(loop); }
window.__seek = t => { document.body.classList.remove('pre'); lane.reset(); const a = frame(t); return Promise.resolve(a).then(() => frame(t)); };
window.__step = t => frame(t);
window.__total = END;
if (!RENDER) { const q = new URLSearchParams(location.search); if (q.has('t')) window.__seek(parseFloat(q.get('t'))); else requestAnimationFrame(loop); }
</script></body></html>
